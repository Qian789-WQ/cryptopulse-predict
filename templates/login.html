<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoPulse Pro - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .login-box {
            background: rgba(20, 27, 45, 0.9);
            border: 1px solid #2a3450;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .logo p {
            color: #525f7a;
            font-size: 13px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #8892b0;
            font-size: 13px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0e1421;
            border: 1px solid #2a3450;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #667eea;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-1px);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #525f7a;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <h1>CryptoPulse Pro</h1>
            <p>AI加密货币预测与交易分析系统</p>
        </div>
        <div class="form-group">
            <label>访问密码</label>
            <input type="password" id="password" placeholder="请输入访问密码" onkeypress="if(event.key==='Enter')login()">
        </div>
        <button class="btn-login" onclick="login()">登 录</button>
        <div class="error" id="errorMsg">密码错误，请重试</div>
        <div class="footer">
            仅限授权用户访问
        </div>
    </div>
    <script>
        async function login() {
            const password = document.getElementById('password').value;
            if (!password) return;
            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: password})
                });
                const data = await resp.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                    document.getElementById('password').value = '';
                }
            } catch(e) {
                document.getElementById('errorMsg').textContent = '网络错误，请重试';
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
